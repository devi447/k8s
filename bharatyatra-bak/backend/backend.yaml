apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: bharatyatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: devidevops447/bharatyatra-backend:vvv555
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: PORT
          value: "5000"

        - name: MONGO_URI
          value: "mongodb://mongodb-service:27017/bharatyatra"

        - name: JWT_SECRET
          value: "bharatyatra123"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bharatyatra
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 31100
