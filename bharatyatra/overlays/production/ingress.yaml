apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bharatyatra-ui
  annotations:
    alb.ingress.kubernetes.io/group.name: demo-lb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # ✅ Health check (IMPORTANT)
    alb.ingress.kubernetes.io/healthcheck-path: /

   # ✅ HTTP + HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    # ✅ SSL
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:741616023974:certificate/8ecd729f-3a13-4ba3-af6b-df214c5805b5
    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: alb
  rules:
  - host: bharatyatra-ui.showmysite.click
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bharatyatra-ui-service
            port:
              number: 80


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bharatyatra-api
  namespace: bharatyatra
  annotations:
    alb.ingress.kubernetes.io/group.name: demo-lb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:741616023974:certificate/8ecd729f-3a13-4ba3-af6b-df214c5805b5

    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: alb

  rules:
    - host: bharatyatra-api.showmysite.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-bharatyatra-api-service
                port:
                  number: 5000