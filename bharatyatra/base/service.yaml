apiVersion: v1
kind: Service
metadata:
  name: bharatyatra-ui-service
spec:
  type: ClusterIP
  selector:
    app: bharatyatra-ui
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: bharatyatra-api-service
  namespace: bharatyatra
spec:
  type: ClusterIP
  selector:
    app: bharatyatra-api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000