apiVersion: v1
kind: Service
metadata:
  name: prod-bharatyatra-ui-service
spec:
  selector:
    app: bharatyatra-ui
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: prod-bharatyatra-api-service
spec:
  selector:
    app: bharatyatra-api
  ports:
  - port: 5000
    targetPort: 5000

---
