apiVersion: v1
kind: Service
metadata:
  name: bharatyatra-ui-service
  namespace: bharatyatra
spec:
  type: NodePort
  selector:
    app: bharatyatra-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31000

---
apiVersion: v1
kind: Service
metadata:
  name: bharatyatra-api-service
  namespace: bharatyatra
spec:
  type: NodePort
  selector:
    app: bharatyatra-api
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 31100
