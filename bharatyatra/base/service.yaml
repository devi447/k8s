apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: bharatyatra
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31000

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bharatyatra
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 31100
